<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHOOFAST - School On-Demand Services</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Chart.js untuk Decision Support System -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4f46e5', secondary: '#8b5cf6', dark: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & Animations */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism for Auth */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-3"></div>

    <!-- 1. AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-indigo-900 via-primary to-secondary absolute inset-0 z-40 transition-opacity duration-500">
        <!-- Auth Card -->
        <div class="glass p-8 md:p-10 rounded-3xl shadow-2xl max-w-md w-full mx-4 transform transition-all duration-500 hover:shadow-primary/50 relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-32 h-32 bg-secondary rounded-full opacity-20 blur-2xl"></div>
            
            <div class="text-center mb-8 relative z-10">
                <div class="w-20 h-20 bg-gradient-to-tr from-primary to-secondary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg transform hover:rotate-3 transition-transform">
                    <svg class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" /><path d="M13 14l-3 4h4l-2 4" stroke="currentColor" class="text-amber-300"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-dark tracking-tight">SCHOO<span class="text-primary">FAST</span></h1>
                <p class="text-sm text-slate-500 mt-1 font-medium">DSS & On-Demand Services</p>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5 relative z-10 block">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="text" id="login-user" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Masukkan username">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-primary to-secondary hover:from-indigo-600 hover:to-purple-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all">
                    Masuk ke Sistem
                </button>
                <div class="flex justify-between text-xs text-slate-500 mt-4 px-2">
                    <p>Siswa: <span class="font-bold text-primary">siswa</span> / <span class="font-bold">123</span></p>
                    <p>Admin: <span class="font-bold text-primary">admin</span> / <span class="font-bold">123</span></p>
                </div>
                <p class="text-center text-sm text-slate-600 mt-4 border-t border-slate-200 pt-4">Belum punya akun? <a href="#" onclick="toggleAuthMode('register')" class="text-primary font-bold hover:underline">Daftar sekarang</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 relative z-10 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all" placeholder="Nama Anda">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                        <input type="text" id="reg-user" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all" placeholder="username">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" id="reg-pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all" placeholder="••••">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Peran (Role)</label>
                    <select id="reg-role" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all cursor-pointer">
                        <option value="siswa">Siswa / Pelajar</option>
                        <option value="admin">Admin / Guru / Petugas</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-dark hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all mt-2">
                    Buat Akun
                </button>
                <p class="text-center text-sm text-slate-600 mt-4 border-t border-slate-200 pt-4">Sudah punya akun? <a href="#" onclick="toggleAuthMode('login')" class="text-primary font-bold hover:underline">Kembali Login</a></p>
            </form>
        </div>
    </div>

    <!-- 2. MAIN APP CONTAINER -->
    <div id="app-screen" class="hidden w-full h-full flex relative">
        <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-dark/50 backdrop-blur-sm z-20 hidden lg:hidden transition-opacity"></div>

        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="fixed lg:static w-72 h-full bg-dark text-slate-300 flex flex-col z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between lg:justify-start gap-4 bg-slate-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" /><path d="M13 14l-3 4h4l-2 4" stroke="currentColor" class="text-amber-300"/>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold tracking-wider text-white">SCHOO<span class="text-primary">FAST</span></h2>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white"><i class="ph ph-x text-2xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto py-6 custom-scrollbar">
                <p class="px-6 text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Layanan Utama</p>
                <ul class="space-y-2 px-4" id="nav-links"></ul>
            </div>

            <div class="p-5 border-t border-slate-800 bg-slate-900">
                <div class="flex items-center gap-3 mb-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white font-bold shadow-inner">
                        <i class="ph ph-user text-xl"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-bold text-white truncate" id="user-name">Nama User</p>
                        <p class="text-xs text-primary font-medium uppercase tracking-wide" id="user-role">Role</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white border border-red-500/20 text-sm font-bold rounded-xl transition-all flex items-center justify-center group">
                    <i class="ph ph-sign-out mr-2 group-hover:-translate-x-1 transition-transform"></i> Keluar Sistem
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col relative h-full overflow-hidden w-full bg-slate-50/50">
            <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center px-4 lg:px-8 shadow-sm z-10 shrink-0">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 mr-4 bg-white rounded-lg border border-slate-200 shadow-sm text-slate-600 hover:text-primary transition-colors">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <div>
                    <h1 class="text-2xl font-bold text-dark tracking-tight" id="page-title">Dashboard</h1>
                    <p class="text-sm text-slate-500 hidden md:block" id="page-subtitle">Ringkasan aktivitas dan status operasional</p>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8" id="main-content"></div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- LOGIKA SISTEM & ANALYTICS (JAVASCRIPT)     -->
    <!-- ========================================== -->
    <script>
        /**
         * 1. INISIALISASI & KONFIGURASI DATABASE
         * Data historis semu disematkan HANYA agar Analytics tidak kosong saat demo awal.
         * STRUKTUR LOGIKA INTI TETAP TIDAK BERUBAH.
         */
        const DB_KEY = 'schoofast_db_v2';
        let currentUser = null;
        let currentView = 'dashboard';
        let chartInstance = null; // Menyimpan instance chart agar bisa di-destroy

        // Helper mock date for initial data
        const now = Date.now();
        const yest = now - 86400000;
        const lastWeek = now - (86400000 * 5);

        const initialDB = {
            users: [
                { id: 'U-001', name: 'Budi (Siswa Demo)', username: 'siswa', password: '123', role: 'siswa' },
                { id: 'U-002', name: 'Pak Guru (Admin Demo)', username: 'admin', password: '123', role: 'admin' }
            ],
            med: [
                // Menambahkan sedikit history agar fitur Analytics jalan
                { id: 'MED-1', userId: 'U-001', name: 'Budi (Siswa Demo)', location: 'Lapangan', severity: 1, status: 'Selesai', timestamp: lastWeek },
                { id: 'MED-2', userId: 'U-003', name: 'Anton', location: 'Kantin', severity: 2, status: 'Selesai', timestamp: yest },
            ], 
            lib_books: [
                { id: 'B01', title: 'Pemrograman Web dengan Node.js', author: 'Riza Fahmi', category: 'Teknologi', stock: 1, total: 2 },
                { id: 'B02', title: 'Fisika Kuantum Dasar', author: 'Prof. Yohanes', category: 'Sains', stock: 0, total: 1 },
                { id: 'B03', title: 'Sejarah Indonesia Modern', author: 'M.C. Ricklefs', category: 'Sejarah', stock: 5, total: 5 },
                { id: 'B04', title: 'Matematika Diskrit', author: 'Rinaldi Munir', category: 'Matematika', stock: 2, total: 3 },
                { id: 'B05', title: 'Laskar Pelangi', author: 'Andrea Hirata', category: 'Sastra', stock: 3, total: 4 }
            ],
            lib_loans: [
                // Mock history
                { id: 'LIB-1', bookId: 'B01', userId: 'U-001', status: 'Dikembalikan', date: lastWeek },
                { id: 'LIB-2', bookId: 'B01', userId: 'U-003', status: 'Dipinjam', date: yest },
                { id: 'LIB-3', bookId: 'B02', userId: 'U-004', status: 'Dipinjam', date: yest },
                { id: 'LIB-4', bookId: 'B04', userId: 'U-001', status: 'Dikembalikan', date: lastWeek },
                { id: 'LIB-5', bookId: 'B05', userId: 'U-005', status: 'Dipinjam', date: now }
            ], 
            fix: [
                { id: 'FIX-1', userId: 'U-001', item: 'AC Kelas 10A Bocor', location: 'Kelas 10A', urgency: 'Tinggi', status: 'Selesai' },
                { id: 'FIX-2', userId: 'U-003', item: 'Kran Toilet Pria Patah', location: 'Toilet Lt 1', urgency: 'Tinggi', status: 'Menunggu Review' },
                { id: 'FIX-3', userId: 'U-004', item: 'Proyektor Buram', location: 'Lab Komputer', urgency: 'Rendah', status: 'Sedang Diperbaiki' },
                { id: 'FIX-4', userId: 'U-005', item: 'Kabel Listrik Terbuka', location: 'Koridor', urgency: 'Kritis', status: 'Masuk Antrian Perbaikan' }
            ], 
            gear_items: [
                { id: 'G01', name: 'Proyektor LCD Epson', type: 'alat' },
                { id: 'G02', name: 'Ruang Aula Utama', type: 'ruang' },
                { id: 'G03', name: 'Kamera DSLR Canon', type: 'alat' },
                { id: 'G04', name: 'Laboratorium Komputer', type: 'ruang' }
            ],
            gear_reqs: [
                { id: 'GER-1', itemId: 'G02', start: lastWeek, end: lastWeek + 7200000, status: 'Disetujui' },
                { id: 'GER-2', itemId: 'G04', start: yest, end: yest + 14400000, status: 'Disetujui' },
                { id: 'GER-3', itemId: 'G02', start: now + 86400000, end: now + 90000000, status: 'Disetujui' }
            ], 
            adm: [] 
        };

        function getDB() { const db = localStorage.getItem(DB_KEY); return db ? JSON.parse(db) : initialDB; }
        function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

        /**
         * 2. UI HELPERS
         */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let colors, icon;
            if (type === 'success') { colors = 'bg-emerald-50 text-emerald-600 border border-emerald-200'; icon = 'ph-check-circle text-emerald-500'; }
            else if (type === 'error') { colors = 'bg-red-50 text-red-600 border border-red-200'; icon = 'ph-warning-circle text-red-500'; }
            else { colors = 'bg-indigo-50 text-indigo-600 border border-indigo-200'; icon = 'ph-info text-indigo-500'; }
            toast.className = `${colors} px-5 py-4 rounded-2xl shadow-xl flex items-center gap-4 fade-in transform transition-all duration-300 w-max max-w-sm`;
            toast.innerHTML = `<i class="ph ${icon} text-2xl drop-shadow-sm"></i><p class="text-sm font-semibold tracking-wide">${message}</p>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-10px) scale(0.95)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function generateId(prefix) { return prefix + '-' + Math.random().toString(36).substr(2, 5).toUpperCase(); }
        function formatDate(timestamp) { return new Date(timestamp).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); }

        function getStatusBadge(status) {
            const map = {
                'Menunggu': 'bg-amber-100 text-amber-700', 'Diproses': 'bg-blue-100 text-blue-700', 'Selesai': 'bg-emerald-100 text-emerald-700',
                'Ditolak': 'bg-red-100 text-red-700', 'Diajukan': 'bg-amber-100 text-amber-700', 'Dipinjam': 'bg-indigo-100 text-indigo-700',
                'Dikembalikan': 'bg-emerald-100 text-emerald-700', 'Menunggu Review': 'bg-amber-100 text-amber-700',
                'Sedang Diperbaiki': 'bg-blue-100 text-blue-700', 'Disetujui': 'bg-emerald-100 text-emerald-700', 'Masuk Antrian Perbaikan': 'bg-purple-100 text-purple-700'
            };
            const classes = map[status] || 'bg-slate-100 text-slate-700';
            return `<span class="px-3 py-1 rounded-lg text-xs font-bold border border-black/5 ${classes} shadow-sm inline-flex items-center gap-1">${status}</span>`;
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('mobile-overlay').classList.toggle('hidden'); }

        /**
         * 3. AUTHENTICATION
         */
        function toggleAuthMode(mode) {
            document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
            document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
        }

        function handleRegister(e) {
            e.preventDefault(); const db = getDB();
            const name = document.getElementById('reg-name').value;
            const user = document.getElementById('reg-user').value;
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;
            if(db.users.find(u => u.username === user)) { showToast('Username sudah dipakai.', 'error'); return; }
            db.users.push({ id: generateId('U'), name, username: user, password: pass, role });
            saveDB(db); showToast('Akun berhasil dibuat! Silakan login.', 'success');
            toggleAuthMode('login'); document.getElementById('register-form').reset();
        }

        function handleLogin(e) {
            e.preventDefault(); const db = getDB();
            const user = document.getElementById('login-user').value; const pass = document.getElementById('login-pass').value;
            const foundUser = db.users.find(u => u.username === user && u.password === pass);
            if (foundUser) {
                currentUser = { id: foundUser.id, name: foundUser.name, role: foundUser.role };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showToast(`Selamat datang, ${currentUser.name}!`, 'success'); checkAuth();
            } else { showToast('Username atau password salah!', 'error'); }
        }

        function checkAuth() {
            const stored = localStorage.getItem('currentUser');
            if (stored) {
                currentUser = JSON.parse(stored);
                document.getElementById('auth-screen').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => document.getElementById('auth-screen').classList.add('hidden'), 500);
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-name').innerText = currentUser.name;
                document.getElementById('user-role').innerText = currentUser.role === 'admin' ? 'Administrator' : 'Siswa / Pelajar';
                renderSidebar(); navigate('dashboard');
            } else {
                document.getElementById('auth-screen').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }

        function logout() { localStorage.removeItem('currentUser'); currentUser = null; document.getElementById('login-form').reset(); checkAuth(); }

        /**
         * 4. ROUTER & MENUS
         */
        const menuItems = [
            { id: 'dashboard', label: 'Dashboard Utama', icon: 'ph-squares-four', sub: currentUser?.role==='admin' ? 'Transaction & Analytics DSS' : 'Ringkasan & Aktivitas' },
            { id: 'med', label: 'SCHOO-MED', icon: 'ph-first-aid-kit', sub: 'Layanan Darurat & Kesehatan' },
            { id: 'lib', label: 'SCHOO-LIB', icon: 'ph-books', sub: 'Perpustakaan & Peminjaman' },
            { id: 'fix', label: 'SCHOO-FIX', icon: 'ph-wrench', sub: 'Pelaporan Kerusakan Sarpras' },
            { id: 'gear', label: 'SCHOO-GEAR', icon: 'ph-projector-screen', sub: 'Peminjaman Ruang & Alat' },
            { id: 'adm', label: 'SCHOO-ADM', icon: 'ph-envelope-simple', sub: 'Persuratan & Administrasi' }
        ];

        function renderSidebar() {
            const nav = document.getElementById('nav-links');
            nav.innerHTML = menuItems.map(item => `
                <li><a href="#" onclick="navigate('${item.id}')" id="nav-${item.id}" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white hover:bg-slate-800 group"><i class="ph ${item.icon} text-2xl group-hover:text-primary transition-colors"></i>${item.label}</a></li>
            `).join('');
            if(currentUser.role === 'admin') {
                nav.innerHTML += `<li class="mt-8"><a href="#" onclick="resetSystem()" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all duration-200 text-red-400 hover:text-white hover:bg-red-500/20 group border border-transparent hover:border-red-500/30"><i class="ph ph-warning-circle text-2xl group-hover:rotate-12 transition-transform"></i> Reset Data</a></li>`;
            }
        }

        function navigate(viewId) {
            currentView = viewId;
            document.querySelectorAll('#nav-links a').forEach(el => {
                el.classList.remove('bg-primary/10', 'text-primary', 'border', 'border-primary/20');
                el.classList.add('text-slate-400', 'border-transparent');
                el.querySelector('i').classList.remove('text-primary');
            });
            const activeNav = document.getElementById(`nav-${viewId}`);
            if(activeNav) {
                activeNav.classList.add('bg-primary/10', 'text-primary', 'border', 'border-primary/20');
                activeNav.classList.remove('text-slate-400', 'border-transparent');
                activeNav.querySelector('i').classList.add('text-primary');
            }

            const titleObj = menuItems.find(m => m.id === viewId);
            document.getElementById('page-title').innerText = titleObj ? titleObj.label : 'Dashboard';
            // dynamic subtitle update if admin
            let subtitle = titleObj ? titleObj.sub : '';
            if(viewId === 'dashboard' && currentUser.role === 'admin') subtitle = 'Transaction Summary & Decision Support Analytics';
            document.getElementById('page-subtitle').innerText = subtitle;

            const content = document.getElementById('main-content');
            content.className = "flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 fade-in"; 
            
            if(window.innerWidth < 1024 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) toggleSidebar();
            
            if(viewId === 'dashboard') renderDashboard(content);
            else if(viewId === 'med') renderMed(content);
            else if(viewId === 'lib') renderLib(content);
            else if(viewId === 'fix') renderFix(content);
            else if(viewId === 'gear') renderGear(content);
            else if(viewId === 'adm') renderAdm(content);
        }

        function resetSystem() {
            if(confirm("PERINGATAN! Seluruh data simulasi akan dihapus. Lanjutkan?")) {
                saveDB(initialDB); showToast("Sistem berhasil di-reset!", "success"); logout();
            }
        }

        /**
         * 5. DASHBOARD & DSS ANALYTICS LAYER (READ-ONLY)
         */
        function renderDashboard(container) {
            const db = getDB();
            const statCard = (icon, color, title, val) => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-5 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-md group">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-inner transition-transform group-hover:scale-110 ${color}"><i class="ph ${icon}"></i></div>
                    <div><p class="text-xs font-bold text-slate-500 uppercase tracking-wider">${title}</p><p class="text-3xl font-black text-dark mt-1">${val}</p></div>
                </div>`;
            
            let html = `
                <!-- TPS Shortcut Layer -->
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-6 mb-8">
                    ${statCard('ph-first-aid-kit', 'bg-red-50 text-red-500', 'Antrian PMR', db.med.filter(m=>m.status!=='Selesai').length)}
                    ${statCard('ph-books', 'bg-indigo-50 text-indigo-500', 'Buku Dipinjam', db.lib_loans.filter(l=>l.status==='Dipinjam').length)}
                    ${statCard('ph-wrench', 'bg-amber-50 text-amber-500', 'Laporan Rusak', db.fix.filter(f=>f.status!=='Selesai').length)}
                    ${statCard('ph-envelope-simple', 'bg-emerald-50 text-emerald-500', 'Surat Aktif', db.adm.filter(a=>a.step < 4).length)}
                </div>`;

            // ==========================================
            // DECISION SUPPORT SYSTEM (DSS) LAYER - ADMIN ONLY
            // ==========================================
            if(currentUser.role === 'admin') {
                // Feature 1: Total MED Hari Ini vs Rata-rata
                const todayStart = new Date(); todayStart.setHours(0,0,0,0);
                const medToday = db.med.filter(m => m.timestamp >= todayStart.getTime()).length;
                let medAvg = 0, trendIcon = '', trendColor = '', trendText = '';
                if(db.med.length > 0) {
                    const minTime = Math.min(...db.med.map(m=>m.timestamp));
                    const daysElapsed = Math.max(1, Math.ceil((Date.now() - minTime) / (1000 * 60 * 60 * 24)));
                    medAvg = (db.med.length / daysElapsed).toFixed(1);
                    if(medToday > medAvg) { trendIcon = 'ph-trend-up'; trendColor = 'text-red-500 bg-red-100'; trendText = 'Naik di atas rata-rata'; }
                    else if(medToday < medAvg) { trendIcon = 'ph-trend-down'; trendColor = 'text-emerald-500 bg-emerald-100'; trendText = 'Turun di bawah rata-rata'; }
                    else { trendIcon = 'ph-minus'; trendColor = 'text-slate-500 bg-slate-100'; trendText = 'Sama dengan rata-rata'; }
                } else { trendIcon = 'ph-minus'; trendColor = 'text-slate-500 bg-slate-100'; trendText = 'Belum ada data historis'; }

                // Feature 3: Top 5 Books
                const bookCounts = {};
                db.lib_loans.forEach(l => { bookCounts[l.bookId] = (bookCounts[l.bookId] || 0) + 1; });
                const topBooks = Object.keys(bookCounts)
                    .map(id => ({ id, title: db.lib_books.find(b=>b.id===id)?.title || 'Unknown', count: bookCounts[id] }))
                    .sort((a,b) => b.count - a.count).slice(0, 5);
                const totalLoans = db.lib_loans.length;

                // Feature 4: Top Rooms Utilized
                const roomStats = {};
                db.gear_reqs.filter(r => r.status === 'Disetujui').forEach(r => {
                    const item = db.gear_items.find(i=>i.id===r.itemId);
                    if(item && item.type === 'ruang') {
                        if(!roomStats[r.itemId]) roomStats[r.itemId] = { name: item.name, count: 0, duration: 0 };
                        roomStats[r.itemId].count += 1;
                        roomStats[r.itemId].duration += (r.end - r.start) / (1000 * 60 * 60); // In hours
                    }
                });
                const topRooms = Object.values(roomStats).sort((a,b) => b.count - a.count);

                html += `
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-dark flex items-center gap-2 border-b border-slate-200 pb-2"><i class="ph ph-chart-polar text-primary"></i> Decision Support Analytics</h2>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    <!-- Feature 1: MED Trend KPI -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center relative overflow-hidden">
                        <div class="absolute -right-4 -bottom-4 opacity-5"><i class="ph ph-pulse text-9xl"></i></div>
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Insiden Kesehatan Hari Ini</h3>
                        <div class="flex items-end gap-3">
                            <span class="text-5xl font-black text-dark">${medToday}</span>
                            <span class="text-sm text-slate-500 mb-1">Kasus</span>
                        </div>
                        <div class="mt-4 flex items-center gap-2 text-sm font-medium">
                            <span class="px-2 py-1 rounded-md flex items-center gap-1 ${trendColor}"><i class="ph ${trendIcon} font-bold"></i> ${medToday} vs ${medAvg}</span>
                            <span class="text-slate-500 text-xs">${trendText}</span>
                        </div>
                    </div>

                    <!-- Feature 2: FIX Distribution Chart -->
                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div class="w-1/2">
                            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Distribusi Tingkat Kerusakan (SCHOO-FIX)</h3>
                            <p class="text-xs text-slate-500 mb-4">Membantu memprioritaskan anggaran *maintenance* berdasarkan profil urgensi historis laporan.</p>
                            <div class="flex gap-4">
                                <div><p class="text-2xl font-bold text-dark">${db.fix.length}</p><p class="text-xs font-bold text-slate-400">Total Laporan</p></div>
                                <div><p class="text-2xl font-bold text-red-500">${db.fix.filter(f=>f.urgency==='Kritis').length}</p><p class="text-xs font-bold text-red-400">Kritis</p></div>
                            </div>
                        </div>
                        <div class="w-1/2 h-40 relative flex justify-end">
                            <canvas id="fixChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                    <!-- Feature 3: Top Books -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Buku Paling Diminati (Top 5)</h3>
                        <ul class="space-y-3">
                            ${topBooks.length === 0 ? '<p class="text-sm text-slate-400">Belum ada data peminjaman.</p>' : topBooks.map((b, idx) => `
                            <li class="flex items-center justify-between group">
                                <div class="flex items-center gap-3">
                                    <span class="w-6 h-6 rounded bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                                    <span class="text-sm font-semibold text-dark truncate max-w-[200px] group-hover:text-primary transition-colors">${b.title}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-bold text-slate-500">${b.count}x dipinjam</span>
                                    <div class="w-16 h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-primary rounded-full" style="width: ${(b.count/totalLoans)*100}%"></div>
                                    </div>
                                </div>
                            </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- Feature 4: Top Rooms Utilized -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Utilisasi Ruangan Tertinggi</h3>
                        <ul class="space-y-3">
                            ${topRooms.length === 0 ? '<p class="text-sm text-slate-400">Belum ada ruangan dibooking.</p>' : topRooms.map((r, idx) => `
                            <li class="flex flex-col p-3 rounded-xl bg-slate-50 border border-slate-100 hover:border-slate-300 transition-colors">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-sm font-bold text-dark flex items-center gap-2"><i class="ph ph-door text-slate-400"></i> ${r.name}</span>
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded">${r.count} Booking</span>
                                </div>
                                <div class="flex justify-between items-center text-xs text-slate-500">
                                    <span>Total Waktu Penggunaan Historis:</span>
                                    <span class="font-bold text-dark">${r.duration.toFixed(1)} Jam</span>
                                </div>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
                `;

                // Render Chart using setTimeout because Canvas needs to be in DOM first
                setTimeout(() => {
                    if (chartInstance) chartInstance.destroy(); // Prevent memory leak / canvas reuse issue
                    const ctx = document.getElementById('fixChart');
                    if(ctx) {
                        const r = db.fix.filter(f=>f.urgency==='Rendah').length;
                        const t = db.fix.filter(f=>f.urgency==='Tinggi').length;
                        const k = db.fix.filter(f=>f.urgency==='Kritis').length;
                        chartInstance = new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['Rendah', 'Tinggi', 'Kritis'],
                                datasets: [{ data: [r, t, k], backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444'], borderWidth: 0, hoverOffset: 4 }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: {family: 'Poppins', size: 10} } } }, cutout: '70%' }
                        });
                    }
                }, 0);
            } else {
                // UI Dashboard untuk Siswa
                html += `
                <div class="bg-gradient-to-br from-primary to-secondary rounded-3xl shadow-lg p-8 text-white relative overflow-hidden group">
                    <div class="absolute -right-10 -top-10 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-1000"></div>
                    <div class="relative z-10">
                        <h3 class="text-2xl font-bold mb-3 tracking-tight">Selamat Datang di SCHOOFAST v2.1</h3>
                        <p class="text-primary-100 text-lg max-w-2xl leading-relaxed">Platform layanan terpadu berbasis <span class="font-bold text-white">*On-Demand*</span> untuk menunjang efektivitas kegiatan operasional sekolah secara cerdas dan cepat.</p>
                        <button onclick="navigate('lib')" class="mt-6 px-6 py-3 bg-white text-primary font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">Jelajahi Perpustakaan</button>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        /**
         * 6. MODUL TRANSAKSI (TIDAK ADA PERUBAHAN LOGIKA DARI VERSI SEBELUMNYA)
         */

        // --- SCHOO-MED ---
        function renderMed(container) {
            const db = getDB(); let html = '';
            if (currentUser.role === 'siswa') {
                const myReqs = db.med.filter(m => m.userId === currentUser.id);
                html += `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
                    <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="text-lg font-bold text-dark mb-5 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-red-100 text-red-500 flex items-center justify-center"><i class="ph ph-plus-circle text-xl"></i></div> Panggil PMR</h3>
                        <form onsubmit="submitMed(event)" class="space-y-5">
                            <div><label class="block text-sm font-semibold mb-2">Lokasi Kejadian</label><select id="med-loc" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"><option value="">-- Pilih Lokasi --</option><option value="Lapangan Basket">Lapangan Basket</option><option value="Kelas 12 IPA 1">Kelas 12 IPA 1</option><option value="Kantin">Kantin</option><option value="Laboratorium">Laboratorium</option></select></div>
                            <div>
                                <label class="block text-sm font-semibold mb-2">Tingkat Urgensi</label>
                                <div class="space-y-3">
                                    <label class="flex items-center gap-3 p-3 border border-slate-200 bg-slate-50 rounded-xl cursor-pointer hover:bg-white transition-all group"><input type="radio" name="med-severity" value="1" required class="w-5 h-5 text-indigo-600 focus:ring-indigo-500"><div><span class="font-bold text-dark">Ringan</span> <span class="text-xs text-slate-500 block">Pusing, Luka Lecet</span></div></label>
                                    <label class="flex items-center gap-3 p-3 border border-slate-200 bg-slate-50 rounded-xl cursor-pointer hover:bg-white transition-all group"><input type="radio" name="med-severity" value="2" class="w-5 h-5 text-amber-500 focus:ring-amber-500"><div><span class="font-bold text-dark">Sedang</span> <span class="text-xs text-slate-500 block">Demam Tinggi, Mimisan</span></div></label>
                                    <label class="flex items-center gap-3 p-3 border border-slate-200 bg-slate-50 rounded-xl cursor-pointer hover:bg-white transition-all group"><input type="radio" name="med-severity" value="3" class="w-5 h-5 text-red-600 focus:ring-red-600"><div><span class="font-bold text-dark">Berat</span> <span class="text-xs text-slate-500 block">Pingsan, Patah Tulang</span></div></label>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-md transition-all mt-4 flex justify-center items-center gap-2"><i class="ph ph-siren text-xl"></i> Kirim SOS Darurat</button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5">Riwayat Panggilan Saya</h3>${generateTable(['ID', 'Waktu', 'Lokasi', 'Status'], myReqs.map(r => [r.id, formatDate(r.timestamp), r.location, getStatusBadge(r.status)]))}</div>
                </div>`;
            } else {
                const activeReqs = db.med.filter(m => m.status !== 'Selesai').sort((a, b) => { if (b.severity !== a.severity) return b.severity - a.severity; return a.timestamp - b.timestamp; });
                html += `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-lg font-bold mb-6 text-red-500 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center animate-pulse"><i class="ph ph-warning-circle text-xl"></i></div> Antrian Prioritas FSM (Real-Time)</h3>
                    <div class="overflow-x-auto custom-scrollbar pb-2">
                        <table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider text-xs"><tr><th class="p-4 font-bold rounded-tl-xl">Tingkat</th><th class="p-4 font-bold">Pasien & Lokasi</th><th class="p-4 font-bold">Waktu Masuk</th><th class="p-4 font-bold">Status</th><th class="p-4 font-bold text-right rounded-tr-xl">Aksi</th></tr></thead>
                            <tbody class="divide-y divide-slate-100">${activeReqs.length === 0 ? '<tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium">Tidak ada antrian darurat saat ini.</td></tr>' : activeReqs.map(r => {
                                const sev = r.severity == 3 ? '<span class="px-3 py-1 bg-red-100 text-red-600 rounded-lg font-bold border border-red-200 flex w-max items-center gap-1"><i class="ph ph-warning"></i> Berat</span>' : (r.severity == 2 ? '<span class="px-3 py-1 bg-amber-100 text-amber-600 rounded-lg font-bold border border-amber-200 flex w-max items-center gap-1"><i class="ph ph-warning-circle"></i> Sedang</span>' : '<span class="px-3 py-1 bg-indigo-100 text-indigo-600 rounded-lg font-bold border border-indigo-200 flex w-max items-center gap-1"><i class="ph ph-info"></i> Ringan</span>');
                                return `<tr class="hover:bg-slate-50"><td class="p-4">${sev}</td><td class="p-4"><div class="font-bold text-dark">${r.name}</div><div class="text-xs text-slate-500">${r.location}</div></td><td class="p-4 text-slate-600">${formatDate(r.timestamp)}</td><td class="p-4">${getStatusBadge(r.status)}</td><td class="p-4 text-right">${r.status === 'Menunggu' ? `<button onclick="updateMedStatus('${r.id}', 'Diproses')" class="px-4 py-2 bg-blue-500 text-white text-xs font-bold rounded-xl shadow hover:bg-blue-600">Tindak Lanjuti</button>` : ''} ${r.status === 'Diproses' ? `<button onclick="updateMedStatus('${r.id}', 'Selesai')" class="px-4 py-2 bg-emerald-500 text-white text-xs font-bold rounded-xl shadow hover:bg-emerald-600">Selesai</button>` : ''}</td></tr>`;
                            }).join('')}</tbody></table>
                    </div>
                </div>`;
            } container.innerHTML = html;
        }
        function submitMed(e) { e.preventDefault(); const db = getDB(); db.med.push({ id: generateId('MED'), userId: currentUser.id, name: currentUser.name, location: document.getElementById('med-loc').value, severity: parseInt(document.querySelector('input[name="med-severity"]:checked').value), status: 'Menunggu', timestamp: Date.now() }); saveDB(db); showToast('Panggilan darurat terkirim!', 'success'); renderMed(document.getElementById('main-content')); }
        function updateMedStatus(id, newStatus) { const db = getDB(); const req = db.med.find(m => m.id === id); if(req) { req.status = newStatus; saveDB(db); showToast(`Status diperbarui.`); renderMed(document.getElementById('main-content')); } }

        // --- SCHOO-LIB ---
        function renderLib(container) {
            const db = getDB(); let html = '';
            if(currentUser.role === 'siswa') {
                const myLoans = db.lib_loans.filter(l => l.userId === currentUser.id);
                html += `
                <div class="mb-8"><h3 class="text-xl font-bold text-dark mb-6 flex items-center gap-3"><div class="w-10 h-10 bg-primary/10 text-primary rounded-xl flex items-center justify-center"><i class="ph ph-books text-2xl"></i></div> Katalog Perpustakaan</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">${db.lib_books.map(b => {
                        const isOut = b.stock === 0;
                        return `<div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between relative overflow-hidden">${isOut ? '<div class="absolute top-4 right-4 bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded-md border border-red-200 z-10">Habis</div>' : ''}<div><div class="w-full h-40 bg-gradient-to-br from-slate-100 to-slate-200 rounded-xl mb-4 flex items-center justify-center text-slate-400 border border-slate-200/50 relative overflow-hidden"><i class="ph ph-book-open-text text-6xl relative z-10"></i></div><h4 class="font-bold text-dark text-lg leading-tight line-clamp-2">${b.title}</h4><p class="text-sm text-slate-500 mt-1 flex items-center gap-1"><i class="ph ph-pen-nib"></i> ${b.author}</p><div class="flex items-center gap-2 mt-3 mb-2"><span class="text-xs font-bold px-2 py-1 bg-slate-100 text-slate-600 rounded-md border border-slate-200">${b.category}</span><span class="text-xs font-bold px-2 py-1 ${isOut?'bg-red-50 text-red-600 border-red-200':'bg-emerald-50 text-emerald-600 border-emerald-200'} rounded-md border">Stok: ${b.stock}/${b.total}</span></div></div><button onclick="requestBook('${b.id}')" ${isOut?'disabled':''} class="mt-4 w-full py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 ${isOut?'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200':'bg-primary hover:bg-indigo-600 text-white shadow-md'}">${isOut?'Tidak Tersedia':'<i class="ph ph-hand-grabbing"></i> Pinjam Buku'}</button></div>`;
                    }).join('')}</div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-4">Aktivitas Peminjaman Saya</h3>${generateTable(['ID', 'Judul Buku', 'Tanggal', 'Status'], myLoans.map(l => { const book = db.lib_books.find(b => b.id === l.bookId); return [l.id, book ? `<span class="font-bold">${book.title}</span>` : '-', formatDate(l.date), getStatusBadge(l.status)]; }))}</div>`;
            } else {
                const activeLoans = db.lib_loans.filter(l => l.status !== 'Dikembalikan');
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-6 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center"><i class="ph ph-arrows-left-right text-xl"></i></div> Manajemen Sirkulasi</h3>
                    ${generateTable(['ID Transaksi', 'Pengguna', 'Buku', 'Status FSM', 'Tindakan'], activeLoans.map(l => {
                        const book = db.lib_books.find(b => b.id === l.bookId); const user = db.users.find(u => u.id === l.userId);
                        const btn = l.status === 'Diajukan' ? `<button onclick="updateLibStatus('${l.id}', 'Dipinjam')" class="px-4 py-2 bg-indigo-500 text-white text-xs font-bold rounded-xl">Berikan Buku</button>` : (l.status === 'Dipinjam' ? `<button onclick="updateLibStatus('${l.id}', 'Dikembalikan')" class="px-4 py-2 bg-emerald-500 text-white text-xs font-bold rounded-xl">Terima Pengembalian</button>` : '');
                        return [`<span class="font-mono text-xs">${l.id}</span>`, `<span class="font-semibold">${user?user.name:l.userId}</span>`, book?book.title:'-', getStatusBadge(l.status), btn];
                    }))}</div>`;
            } container.innerHTML = html;
        }
        function requestBook(bookId) { const db = getDB(); const bookIndex = db.lib_books.findIndex(b => b.id === bookId); if(bookIndex !== -1 && db.lib_books[bookIndex].stock > 0) { db.lib_books[bookIndex].stock -= 1; db.lib_loans.push({ id: generateId('LIB'), bookId: bookId, userId: currentUser.id, status: 'Diajukan', date: Date.now() }); saveDB(db); showToast('Pengajuan sukses!', 'success'); renderLib(document.getElementById('main-content')); } else showToast('Stok habis.', 'error'); }
        function updateLibStatus(loanId, newStatus) { const db = getDB(); const loan = db.lib_loans.find(l => l.id === loanId); if(loan) { loan.status = newStatus; if(newStatus === 'Dikembalikan') { const book = db.lib_books.find(b => b.id === loan.bookId); if(book) book.stock += 1; } saveDB(db); showToast(`Status perpus diupdate.`); renderLib(document.getElementById('main-content')); } }

        // --- SCHOO-FIX ---
        function renderFix(container) {
            const db = getDB(); let html = '';
            if(currentUser.role === 'siswa') {
                html += `<div class="grid grid-cols-1 xl:grid-cols-3 gap-6 lg:gap-8"><div class="xl:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-500 flex items-center justify-center"><i class="ph ph-hammer text-xl"></i></div> Lapor Kerusakan</h3><form onsubmit="submitFix(event)" class="space-y-4"><div><label class="block text-sm font-semibold mb-1">Objek Rusak</label><input type="text" id="fix-item" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"></div><div><label class="block text-sm font-semibold mb-1">Lokasi</label><input type="text" id="fix-loc" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"></div><div><label class="block text-sm font-semibold mb-1">Urgensi</label><select id="fix-urgency" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"><option value="Rendah">Rendah</option><option value="Tinggi">Tinggi</option><option value="Kritis">Kritis</option></select></div><button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md transition-all mt-2">Kirim Laporan</button></form></div><div class="xl:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5">Laporan Saya</h3>${generateTable(['ID', 'Objek', 'Urgensi', 'Status'], db.fix.filter(f=>f.userId===currentUser.id).map(f => [f.id, f.item, f.urgency, getStatusBadge(f.status)]))}</div></div>`;
            } else {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-5 flex items-center gap-2"><i class="ph ph-list-dashes text-primary text-2xl"></i> Manajemen Perbaikan FSM</h3>${generateTable(['ID', 'Objek & Lokasi', 'Urgensi', 'Status Saat Ini', 'Update Progress'], db.fix.map(f => [f.id, `<span class="font-bold">${f.item}</span> <span class="block text-xs">${f.location}</span>`, f.urgency==='Kritis'?'<span class="text-red-500 font-bold">🔴 Kritis</span>':(f.urgency==='Tinggi'?'<span class="text-amber-500 font-bold">🟠 Tinggi</span>':'<span class="text-blue-500 font-bold">🔵 Rendah</span>'), getStatusBadge(f.status), `<select onchange="updateFixStatus('${f.id}', this.value)" class="p-2 border border-slate-200 rounded-lg text-xs bg-white"><option value="" disabled selected>Pindah Status...</option><option value="Menunggu Review">Menunggu</option><option value="Masuk Antrian Perbaikan">Masuk Antrian</option><option value="Sedang Diperbaiki">Diperbaiki</option><option value="Selesai">Selesai</option></select>`]))}</div>`;
            } container.innerHTML = html;
        }
        function submitFix(e) { e.preventDefault(); const db = getDB(); db.fix.push({ id: generateId('FIX'), userId: currentUser.id, item: document.getElementById('fix-item').value, location: document.getElementById('fix-loc').value, urgency: document.getElementById('fix-urgency').value, status: 'Menunggu Review' }); saveDB(db); showToast('Laporan tercatat.'); renderFix(document.getElementById('main-content')); }
        function updateFixStatus(id, stat) { const db = getDB(); const rep = db.fix.find(f => f.id === id); if(rep) { rep.status = stat; saveDB(db); showToast(`Status diperbarui.`); renderFix(document.getElementById('main-content')); } }

        // --- SCHOO-GEAR ---
        function renderGear(container) {
            const db = getDB(); let html = '';
            if(currentUser.role === 'siswa') {
                html += `<div class="grid grid-cols-1 xl:grid-cols-2 gap-6 lg:gap-8"><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-teal-100 text-teal-600 flex items-center justify-center"><i class="ph ph-projector-screen text-xl"></i></div> Booking Ruang/Alat</h3><form onsubmit="submitGear(event)" class="space-y-5"><div><label class="block text-sm font-semibold mb-1">Pilih Fasilitas</label><select id="gear-item" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary cursor-pointer">${db.gear_items.map(i => `<option value="${i.id}">${i.name} (${i.type.toUpperCase()})</option>`).join('')}</select></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-sm font-semibold mb-1">Mulai</label><input type="datetime-local" id="gear-start" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-primary"></div><div><label class="block text-sm font-semibold mb-1">Selesai</label><input type="datetime-local" id="gear-end" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-primary"></div></div><button type="submit" class="w-full py-3.5 bg-dark hover:bg-slate-800 text-white rounded-xl font-bold shadow-lg mt-2">Cek Jadwal & Booking</button></form></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5">Jadwal Aktif (Public)</h3><ul class="space-y-3">${db.gear_reqs.filter(r=>r.status==='Disetujui').map(r => { const item = db.gear_items.find(i=>i.id===r.itemId); return `<li class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between"><span class="font-bold text-dark text-sm"><i class="ph ph-calendar-check text-primary"></i> ${item.name}</span><span class="text-slate-500 font-medium text-xs bg-white px-2 py-1 rounded-lg border border-slate-200">${new Date(r.start).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} - ${new Date(r.end).toLocaleString([],{hour:'2-digit',minute:'2-digit'})}</span></li>`; }).join('') || '<div class="text-center p-8 text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-xl">Belum ada jadwal.</div>'}</ul></div></div>`;
            } else {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-5 flex items-center gap-2"><i class="ph ph-calendar text-primary text-2xl"></i> Approval Peminjaman</h3>${generateTable(['ID', 'Fasilitas', 'Waktu', 'Status', 'Aksi'], db.gear_reqs.map(r => { const item = db.gear_items.find(i=>i.id===r.itemId); const time = `${new Date(r.start).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} - ${new Date(r.end).toLocaleString([],{hour:'2-digit',minute:'2-digit'})}`; const action = r.status === 'Diajukan' ? `<button onclick="updateGearStatus('${r.id}', 'Disetujui')" class="px-3 py-1.5 bg-emerald-100 text-emerald-700 font-bold rounded-lg text-xs mr-1">Approve</button><button onclick="updateGearStatus('${r.id}', 'Ditolak')" class="px-3 py-1.5 bg-red-100 text-red-700 font-bold rounded-lg text-xs">Reject</button>` : '-'; return [r.id, `<span class="font-bold">${item.name}</span>`, time, getStatusBadge(r.status), action]; }))}</div>`;
            } container.innerHTML = html;
        }
        function submitGear(e) { e.preventDefault(); const db = getDB(); const itemId = document.getElementById('gear-item').value; const reqStart = new Date(document.getElementById('gear-start').value).getTime(); const reqEnd = new Date(document.getElementById('gear-end').value).getTime(); if(reqStart >= reqEnd) { showToast('Waktu selesai salah!', 'error'); return; } const isConflict = db.gear_reqs.some(exist => { if(exist.itemId === itemId && exist.status === 'Disetujui') { return (reqStart < exist.end) && (reqEnd > exist.start); } return false; }); if(isConflict) { showToast('Gagal! Jadwal bentrok.', 'error'); } else { db.gear_reqs.push({ id: generateId('GER'), itemId, start: reqStart, end: reqEnd, status: 'Diajukan' }); saveDB(db); showToast('Pengajuan sukses.', 'success'); renderGear(document.getElementById('main-content')); } }
        function updateGearStatus(id, stat) { const db = getDB(); const r = db.gear_reqs.find(x => x.id === id); if(r) { r.status = stat; saveDB(db); showToast(`Pengajuan ${stat}.`); renderGear(document.getElementById('main-content')); } }

        // --- SCHOO-ADM ---
        const ADM_STEPS = ['Draft', 'Review TU', 'Approv Wakasek', 'Approv Kepsek', 'Dokumen Siap'];
        function renderAdm(container) {
            const db = getDB(); let html = '';
            if(currentUser.role === 'siswa') {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8"><h3 class="text-lg font-bold text-dark mb-5 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-pink-100 text-pink-600 flex items-center justify-center"><i class="ph ph-envelope-simple text-xl"></i></div> Request Surat FSM</h3><form onsubmit="submitAdm(event)" class="flex gap-4 items-end"><div class="flex-1 w-full"><label class="block text-sm font-semibold mb-1">Jenis Surat</label><select id="adm-type" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"><option>Surat Keterangan Aktif Siswa</option><option>Surat Pengantar Beasiswa</option><option>Surat Izin Observasi</option></select></div><div class="flex-1 w-full"><label class="block text-sm font-semibold mb-1">Keperluan</label><input type="text" id="adm-purp" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"></div><button type="submit" class="py-3.5 px-8 bg-primary text-white rounded-xl font-bold shadow-md">Ajukan</button></form></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5">Tracking Progress Dokumen</h3><div class="space-y-5">${db.adm.filter(a=>a.userId===currentUser.id).map(a => `<div class="border border-slate-200 rounded-xl p-5 bg-slate-50"><div class="flex justify-between items-center mb-4"><span class="font-bold text-dark">${a.type}</span><span class="font-mono text-xs text-slate-400 bg-white px-2 py-1 rounded border">${a.id}</span></div><div class="w-full bg-slate-200 rounded-full h-3 mb-3 overflow-hidden shadow-inner"><div class="bg-gradient-to-r from-primary to-secondary h-3 rounded-full transition-all duration-1000" style="width: ${(a.step / 4) * 100}%"></div></div><div class="flex justify-between items-center"><p class="text-xs text-slate-500 font-medium">${a.purpose}</p><p class="text-xs font-bold ${a.step===4?'text-emerald-500':'text-primary'} bg-white px-3 py-1.5 rounded-lg border">${ADM_STEPS[a.step]}</p></div></div>`).join('') || '<div class="text-center p-8 text-slate-400 font-medium">Belum ada dokumen diajukan.</div>'}</div></div>`;
            } else {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-5 flex items-center gap-2"><i class="ph ph-file-text text-primary text-2xl"></i> Workflow FSM Persuratan</h3>${generateTable(['ID Surat', 'Jenis & Keperluan', 'Tahap FSM Saat Ini', 'Aksi Lanjut'], db.adm.map(a => { const btn = a.step < 4 ? `<button onclick="advanceAdm('${a.id}')" class="px-4 py-2 bg-primary text-white rounded-xl text-xs font-bold shadow">Naik ke: ${ADM_STEPS[a.step+1]}</button>` : '<span class="text-emerald-500 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">Tuntas</span>'; return [a.id, `<b>${a.type}</b><br><span class="text-xs text-slate-500">${a.purpose}</span>`, `<span class="px-3 py-1.5 bg-slate-100 rounded-lg border text-xs font-bold">${ADM_STEPS[a.step]}</span>`, btn]; }))}</div>`;
            } container.innerHTML = html;
        }
        function submitAdm(e) { e.preventDefault(); const db = getDB(); db.adm.push({ id: generateId('ADM'), userId: currentUser.id, type: document.getElementById('adm-type').value, purpose: document.getElementById('adm-purp').value, step: 1 }); saveDB(db); showToast('Surat diajukan.'); renderAdm(document.getElementById('main-content')); }
        function advanceAdm(id) { const db = getDB(); const a = db.adm.find(x => x.id === id); if(a && a.step < 4) { a.step += 1; saveDB(db); showToast(`Tahap naik ke: ${ADM_STEPS[a.step]}`); renderAdm(document.getElementById('main-content')); } }

        function generateTable(headers, rows) { return `<div class="overflow-x-auto custom-scrollbar pb-2"><table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 tracking-wider"><tr>${headers.map((h,i) => `<th class="p-4 font-bold ${i===0?'rounded-tl-xl':''} ${i===headers.length-1?'rounded-tr-xl':''}">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100">${rows.length === 0 ? `<tr><td colspan="${headers.length}" class="p-8 text-center text-slate-400 font-medium">Data kosong.</td></tr>` : rows.map(r => `<tr class="hover:bg-slate-50 transition-colors">${r.map(c => `<td class="p-4 text-slate-700">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }

        window.onload = () => { if(!localStorage.getItem(DB_KEY)) saveDB(initialDB); checkAuth(); };
    </script>
</body>
</html>
