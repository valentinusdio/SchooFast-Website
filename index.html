<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHOOFAST - School On-Demand Services</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4f46e5', secondary: '#8b5cf6', dark: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & Animations */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism for Auth */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-3"></div>

    <!-- 1. AUTHENTICATION SCREEN (LOGIN & REGISTER) -->
    <div id="auth-screen" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-indigo-900 via-primary to-secondary absolute inset-0 z-40 transition-opacity duration-500">
        <!-- Auth Card -->
        <div class="glass p-8 md:p-10 rounded-3xl shadow-2xl max-w-md w-full mx-4 transform transition-all duration-500 hover:shadow-primary/50 relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-16 -right-16 w-32 h-32 bg-secondary rounded-full opacity-20 blur-2xl"></div>
            
            <div class="text-center mb-8 relative z-10">
                <!-- NEW LOGO SCHOOFAST (SVG) -->
                <div class="w-20 h-20 bg-gradient-to-tr from-primary to-secondary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg transform hover:rotate-3 transition-transform">
                    <svg class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Graduation Cap (School) -->
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                        <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                        <!-- Lightning Bolt (Fast/Tech) -->
                        <path d="M13 14l-3 4h4l-2 4" stroke="currentColor" stroke-width="2" fill="none" class="text-amber-300"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-dark tracking-tight">SCHOO<span class="text-primary">FAST</span></h1>
                <p class="text-sm text-slate-500 mt-1 font-medium">Smart School On-Demand</p>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5 relative z-10 block">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="text" id="login-user" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Masukkan username">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-primary to-secondary hover:from-indigo-600 hover:to-purple-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all">
                    Masuk ke Sistem
                </button>
                <p class="text-center text-sm text-slate-600 mt-4">Belum punya akun? <a href="#" onclick="toggleAuthMode('register')" class="text-primary font-bold hover:underline">Daftar sekarang</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 relative z-10 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all" placeholder="Nama Anda">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                        <input type="text" id="reg-user" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all" placeholder="username">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" id="reg-pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all" placeholder="••••">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Peran (Role)</label>
                    <select id="reg-role" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm transition-all cursor-pointer">
                        <option value="siswa">Siswa / Pelajar</option>
                        <option value="admin">Admin / Guru / Petugas</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-dark hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all mt-2">
                    Buat Akun
                </button>
                <p class="text-center text-sm text-slate-600 mt-4">Sudah punya akun? <a href="#" onclick="toggleAuthMode('login')" class="text-primary font-bold hover:underline">Kembali Login</a></p>
            </form>
        </div>
    </div>

    <!-- 2. MAIN APP CONTAINER -->
    <div id="app-screen" class="hidden w-full h-full flex relative">
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-dark/50 backdrop-blur-sm z-20 hidden lg:hidden transition-opacity"></div>

        <!-- Sidebar Navigation -->
        <!-- Responsive: Hidden on left for mobile, visible on desktop -->
        <nav id="sidebar" class="fixed lg:static w-72 h-full bg-dark text-slate-300 flex flex-col z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between lg:justify-start gap-4 bg-slate-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" /><path d="M13 14l-3 4h4l-2 4" stroke="currentColor" class="text-amber-300"/>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold tracking-wider text-white">SCHOO<span class="text-primary">FAST</span></h2>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white"><i class="ph ph-x text-2xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto py-6 custom-scrollbar">
                <p class="px-6 text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Layanan Utama</p>
                <ul class="space-y-2 px-4" id="nav-links">
                    <!-- Links di-generate via JS -->
                </ul>
            </div>

            <div class="p-5 border-t border-slate-800 bg-slate-900">
                <div class="flex items-center gap-3 mb-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white font-bold shadow-inner">
                        <i class="ph ph-user text-xl"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-bold text-white truncate" id="user-name">Nama User</p>
                        <p class="text-xs text-primary font-medium uppercase tracking-wide" id="user-role">Role</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white border border-red-500/20 text-sm font-bold rounded-xl transition-all flex items-center justify-center group">
                    <i class="ph ph-sign-out mr-2 group-hover:-translate-x-1 transition-transform"></i> Keluar Sistem
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col relative h-full overflow-hidden w-full bg-slate-50/50">
            <!-- Header (Mobile Toggle & Breadcrumb) -->
            <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center px-4 lg:px-8 shadow-sm z-10 shrink-0">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 mr-4 bg-white rounded-lg border border-slate-200 shadow-sm text-slate-600 hover:text-primary transition-colors">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <div>
                    <h1 class="text-2xl font-bold text-dark tracking-tight" id="page-title">Dashboard</h1>
                    <p class="text-sm text-slate-500 hidden md:block" id="page-subtitle">Ringkasan aktivitas dan status operasional</p>
                </div>
            </header>

            <!-- Dynamic Content -->
            <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8" id="main-content">
                <!-- Konten di-render via JS berdasarkan menu -->
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- LOGIKA SISTEM (JAVASCRIPT)                 -->
    <!-- ========================================== -->
    <script>
        /**
         * 1. INISIALISASI & KONFIGURASI DATABASE (localStorage)
         * CATATAN PROFESOR: Menambahkan tabel `users` untuk sistem auth, 
         * memperkaya data `lib_books`, tetapi LOGIKA INTI TIDAK DIUBAH SAMA SEKALI.
         */
        const DB_KEY = 'schoofast_db_v2';
        let currentUser = null;
        let currentView = 'dashboard';

        const initialDB = {
            users: [
                { id: 'U-001', name: 'Budi (Siswa Demo)', username: 'siswa', password: '123', role: 'siswa' },
                { id: 'U-002', name: 'Pak Guru (Admin Demo)', username: 'admin', password: '123', role: 'admin' }
            ],
            med: [], 
            lib_books: [
                { id: 'B01', title: 'Pemrograman Web dengan Node.js', author: 'Riza Fahmi', category: 'Teknologi', stock: 2, total: 2 },
                { id: 'B02', title: 'Fisika Kuantum Dasar', author: 'Prof. Yohanes', category: 'Sains', stock: 0, total: 1 },
                { id: 'B03', title: 'Sejarah Indonesia Modern', author: 'M.C. Ricklefs', category: 'Sejarah', stock: 5, total: 5 },
                { id: 'B04', title: 'Matematika Diskrit', author: 'Rinaldi Munir', category: 'Matematika', stock: 3, total: 3 },
                { id: 'B05', title: 'Laskar Pelangi', author: 'Andrea Hirata', category: 'Sastra', stock: 4, total: 4 },
                { id: 'B06', title: 'Bumi Manusia', author: 'Pramoedya Ananta Toer', category: 'Sastra', stock: 2, total: 2 },
                { id: 'B07', title: 'Desain Grafis Komprehensif', author: 'Rahmat Hidayat', category: 'Seni & Desain', stock: 1, total: 2 },
                { id: 'B08', title: 'Kecerdasan Buatan (AI)', author: 'Sri Kusumadewi', category: 'Teknologi', stock: 3, total: 3 },
                { id: 'B09', title: 'Biologi Sel dan Molekuler', author: 'Neil A. Campbell', category: 'Sains', stock: 0, total: 2 },
                { id: 'B10', title: 'Pengantar Ekonomi Makro', author: 'Sadono Sukirno', category: 'Ekonomi', stock: 5, total: 5 }
            ],
            lib_loans: [], 
            fix: [], 
            gear_items: [
                { id: 'G01', name: 'Proyektor LCD Epson', type: 'alat' },
                { id: 'G02', name: 'Ruang Aula Utama', type: 'ruang' },
                { id: 'G03', name: 'Kamera DSLR Canon', type: 'alat' },
                { id: 'G04', name: 'Laboratorium Komputer', type: 'ruang' }
            ],
            gear_reqs: [], 
            adm: [] 
        };

        function getDB() {
            const db = localStorage.getItem(DB_KEY);
            return db ? JSON.parse(db) : initialDB;
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        /**
         * 2. UI HELPERS & TOAST NOTIFICATION
         */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Modern Toast Styling
            let colors, icon;
            if (type === 'success') { colors = 'bg-emerald-50 text-emerald-600 border border-emerald-200'; icon = 'ph-check-circle text-emerald-500'; }
            else if (type === 'error') { colors = 'bg-red-50 text-red-600 border border-red-200'; icon = 'ph-warning-circle text-red-500'; }
            else { colors = 'bg-indigo-50 text-indigo-600 border border-indigo-200'; icon = 'ph-info text-indigo-500'; }
            
            toast.className = `${colors} px-5 py-4 rounded-2xl shadow-xl flex items-center gap-4 fade-in transform transition-all duration-300 w-max max-w-sm`;
            toast.innerHTML = `<i class="ph ${icon} text-2xl drop-shadow-sm"></i><p class="text-sm font-semibold tracking-wide">${message}</p>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px) scale(0.95)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function generateId(prefix) { return prefix + '-' + Math.random().toString(36).substr(2, 5).toUpperCase(); }
        function formatDate(timestamp) { return new Date(timestamp).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); }

        function getStatusBadge(status) {
            const map = {
                'Menunggu': 'bg-amber-100 text-amber-700 border-amber-200',
                'Diproses': 'bg-blue-100 text-blue-700 border-blue-200',
                'Selesai': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                'Ditolak': 'bg-red-100 text-red-700 border-red-200',
                'Diajukan': 'bg-amber-100 text-amber-700 border-amber-200',
                'Dipinjam': 'bg-indigo-100 text-indigo-700 border-indigo-200',
                'Dikembalikan': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                'Menunggu Review': 'bg-amber-100 text-amber-700 border-amber-200',
                'Sedang Diperbaiki': 'bg-blue-100 text-blue-700 border-blue-200',
                'Disetujui': 'bg-emerald-100 text-emerald-700 border-emerald-200'
            };
            const classes = map[status] || 'bg-slate-100 text-slate-700 border-slate-200';
            return `<span class="px-3 py-1 rounded-lg text-xs font-bold border ${classes} shadow-sm inline-flex items-center gap-1">${status}</span>`;
        }

        // Responsiveness: Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        /**
         * 3. AUTHENTICATION (Real System with localStorage)
         */
        function toggleAuthMode(mode) {
            document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
            document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
        }

        function handleRegister(e) {
            e.preventDefault();
            const db = getDB();
            const name = document.getElementById('reg-name').value;
            const user = document.getElementById('reg-user').value;
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;

            if(db.users.find(u => u.username === user)) {
                showToast('Username sudah dipakai, pilih yang lain.', 'error');
                return;
            }

            const newUser = { id: generateId('U'), name, username: user, password: pass, role };
            db.users.push(newUser);
            saveDB(db);
            showToast('Akun berhasil dibuat! Silakan login.', 'success');
            toggleAuthMode('login');
            document.getElementById('register-form').reset();
        }

        function handleLogin(e) {
            e.preventDefault();
            const db = getDB();
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            const foundUser = db.users.find(u => u.username === user && u.password === pass);

            if (foundUser) {
                // Sesuai struktur aplikasi lama
                currentUser = { id: foundUser.id, name: foundUser.name, role: foundUser.role };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showToast(`Selamat datang, ${currentUser.name}!`, 'success');
                checkAuth();
            } else {
                showToast('Username atau password salah!', 'error');
            }
        }

        function checkAuth() {
            const stored = localStorage.getItem('currentUser');
            if (stored) {
                currentUser = JSON.parse(stored);
                document.getElementById('auth-screen').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => document.getElementById('auth-screen').classList.add('hidden'), 500);
                
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-name').innerText = currentUser.name;
                document.getElementById('user-role').innerText = currentUser.role === 'admin' ? 'Administrator' : 'Siswa / Pelajar';
                renderSidebar();
                navigate('dashboard');
            } else {
                document.getElementById('auth-screen').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('login-form').reset();
            checkAuth();
        }

        /**
         * 4. ROUTER & RENDER LOGIC
         */
        const menuItems = [
            { id: 'dashboard', label: 'Dashboard Utama', icon: 'ph-squares-four', sub: 'Ringkasan & Aktivitas' },
            { id: 'med', label: 'SCHOO-MED', icon: 'ph-first-aid-kit', sub: 'Layanan Darurat & Kesehatan' },
            { id: 'lib', label: 'SCHOO-LIB', icon: 'ph-books', sub: 'Perpustakaan & Peminjaman' },
            { id: 'fix', label: 'SCHOO-FIX', icon: 'ph-wrench', sub: 'Pelaporan Kerusakan Sarpras' },
            { id: 'gear', label: 'SCHOO-GEAR', icon: 'ph-projector-screen', sub: 'Peminjaman Ruang & Alat' },
            { id: 'adm', label: 'SCHOO-ADM', icon: 'ph-envelope-simple', sub: 'Persuratan & Administrasi' }
        ];

        function renderSidebar() {
            const nav = document.getElementById('nav-links');
            nav.innerHTML = menuItems.map(item => `
                <li>
                    <a href="#" onclick="navigate('${item.id}')" id="nav-${item.id}" 
                       class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white hover:bg-slate-800 group">
                        <i class="ph ${item.icon} text-2xl group-hover:text-primary transition-colors"></i>
                        ${item.label}
                    </a>
                </li>
            `).join('');
            if(currentUser.role === 'admin') {
                nav.innerHTML += `
                <li class="mt-8">
                    <a href="#" onclick="resetSystem()" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all duration-200 text-red-400 hover:text-white hover:bg-red-500/20 group border border-transparent hover:border-red-500/30">
                        <i class="ph ph-warning-circle text-2xl group-hover:rotate-12 transition-transform"></i> Reset Data Simulasi
                    </a>
                </li>`;
            }
        }

        function navigate(viewId) {
            currentView = viewId;
            // Update Active Menu Styling
            document.querySelectorAll('#nav-links a').forEach(el => {
                el.classList.remove('bg-primary/10', 'text-primary', 'border', 'border-primary/20');
                el.classList.add('text-slate-400', 'border-transparent');
                el.querySelector('i').classList.remove('text-primary');
            });
            const activeNav = document.getElementById(`nav-${viewId}`);
            if(activeNav) {
                activeNav.classList.add('bg-primary/10', 'text-primary', 'border', 'border-primary/20');
                activeNav.classList.remove('text-slate-400', 'border-transparent');
                activeNav.querySelector('i').classList.add('text-primary');
            }

            // Update Title & Subtitle
            const titleObj = menuItems.find(m => m.id === viewId);
            document.getElementById('page-title').innerText = titleObj ? titleObj.label : 'Dashboard';
            document.getElementById('page-subtitle').innerText = titleObj ? titleObj.sub : '';

            // Render Content
            const content = document.getElementById('main-content');
            content.className = "flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 fade-in"; 
            
            // Tutup sidebar di mobile setelah klik
            if(window.innerWidth < 1024 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
            
            if(viewId === 'dashboard') renderDashboard(content);
            else if(viewId === 'med') renderMed(content);
            else if(viewId === 'lib') renderLib(content);
            else if(viewId === 'fix') renderFix(content);
            else if(viewId === 'gear') renderGear(content);
            else if(viewId === 'adm') renderAdm(content);
        }

        function resetSystem() {
            if(confirm("PERINGATAN! Seluruh data simulasi (termasuk akun baru) akan dihapus. Lanjutkan?")) {
                saveDB(initialDB);
                showToast("Sistem berhasil di-reset!", "success");
                logout(); // Paksa logout agar bisa login pakai default lagi
            }
        }

        /**
         * 5. MODUL 1: DASHBOARD
         */
        function renderDashboard(container) {
            const db = getDB();
            const statCard = (icon, color, title, val) => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-5 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-md group">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-inner transition-transform group-hover:scale-110 ${color}">
                        <i class="ph ${icon}"></i>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">${title}</p>
                        <p class="text-3xl font-black text-dark mt-1">${val}</p>
                    </div>
                </div>
            `;
            
            let html = `
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-6 mb-8">

                        </form>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5">Jadwal Aktif (Public)</h3>
                        <ul class="space-y-3 text-sm">${db.gear_reqs.filter(r=>r.status==='Disetujui').map(r => { const item = db.gear_items.find(i=>i.id===r.itemId); return `<li class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:border-primary/30 transition-colors"><span class="font-bold text-dark flex items-center gap-2"><i class="ph ph-calendar-check text-primary"></i> ${item.name}</span><span class="text-slate-500 font-medium text-xs sm:text-sm bg-white px-3 py-1.5 rounded-lg border border-slate-200">${new Date(r.start).toLocaleString([],{hour:'2-digit',minute:'2-digit'})} - ${new Date(r.end).toLocaleString([],{hour:'2-digit',minute:'2-digit'})}</span></li>`; }).join('') || '<div class="text-center p-8 text-slate-400 font-medium border-2 border-dashed border-slate-200 rounded-xl">Belum ada jadwal disetujui.</div>'}</ul>
                    </div></div>`;
            } else {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-5 flex items-center gap-2"><i class="ph ph-calendar text-primary text-2xl"></i> Approval Peminjaman</h3>
                    ${generateTable(['ID', 'Fasilitas', 'Waktu', 'Status', 'Aksi'], db.gear_reqs.map(r => { const item = db.gear_items.find(i=>i.id===r.itemId); const time = `${new Date(r.start).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} s.d. ${new Date(r.end).toLocaleString([],{hour:'2-digit',minute:'2-digit'})}`; const action = r.status === 'Diajukan' ? `<button onclick="updateGearStatus('${r.id}', 'Disetujui')" class="px-3 py-1.5 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 font-bold rounded-lg text-xs mr-1 transition-colors">Approve</button> <button onclick="updateGearStatus('${r.id}', 'Ditolak')" class="px-3 py-1.5 bg-red-100 text-red-700 hover:bg-red-200 font-bold rounded-lg text-xs transition-colors">Reject</button>` : '-'; return [r.id, `<span class="font-bold">${item.name}</span>`, time, getStatusBadge(r.status), action]; }))}
                </div>`;
            } container.innerHTML = html;
        }
        function submitGear(e) { e.preventDefault(); /* LOGIKA SAMA */ const db = getDB(); const itemId = document.getElementById('gear-item').value; const reqStart = new Date(document.getElementById('gear-start').value).getTime(); const reqEnd = new Date(document.getElementById('gear-end').value).getTime(); if(reqStart >= reqEnd) { showToast('Waktu selesai salah!', 'error'); return; } const isConflict = db.gear_reqs.some(exist => { if(exist.itemId === itemId && exist.status === 'Disetujui') { return (reqStart < exist.end) && (reqEnd > exist.start); } return false; }); if(isConflict) { showToast('Gagal! Jadwal bentrok.', 'error'); } else { db.gear_reqs.push({ id: generateId('GER'), itemId, start: reqStart, end: reqEnd, status: 'Diajukan' }); saveDB(db); showToast('Pengajuan sukses.', 'success'); renderGear(document.getElementById('main-content')); } }
        function updateGearStatus(id, stat) { const db = getDB(); const r = db.gear_reqs.find(x => x.id === id); if(r) { r.status = stat; saveDB(db); showToast(`Pengajuan ${stat}.`); renderGear(document.getElementById('main-content')); } }

        /**
         * 10. MODUL 6: SCHOO-ADM (UI ENHANCEMENTS)
         */
        const ADM_STEPS = ['Draft', 'Review TU', 'Approv Wakasek', 'Approv Kepsek', 'Dokumen Siap'];
        function renderAdm(container) {
            const db = getDB(); let html = '';
            if(currentUser.role === 'siswa') {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
                    <h3 class="text-lg font-bold text-dark mb-5 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-pink-100 text-pink-600 flex items-center justify-center"><i class="ph ph-envelope-simple text-xl"></i></div> Request Surat FSM</h3>
                    <form onsubmit="submitAdm(event)" class="flex flex-col md:flex-row gap-4 items-end">
                        <div class="flex-1 w-full"><label class="block text-sm font-semibold mb-1">Jenis Surat</label><select id="adm-type" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none cursor-pointer"><option>Surat Keterangan Aktif Siswa</option><option>Surat Pengantar Beasiswa</option><option>Surat Izin Observasi</option></select></div>
                        <div class="flex-1 w-full"><label class="block text-sm font-semibold mb-1">Keperluan</label><input type="text" id="adm-purp" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none" placeholder="Tuliskan alasan spesifik..."></div>
                        <button type="submit" class="w-full md:w-auto py-3.5 px-8 bg-primary hover:bg-indigo-600 text-white rounded-xl font-bold shadow-md transform hover:-translate-y-0.5 transition-all">Ajukan</button>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold text-dark mb-5">Tracking Progress Dokumen</h3><div class="space-y-5">
                    ${db.adm.filter(a=>a.userId===currentUser.id).map(a => `
                        <div class="border border-slate-200 rounded-xl p-5 bg-slate-50 hover:bg-white hover:shadow-md transition-all">
                            <div class="flex justify-between items-center mb-4"><span class="font-bold text-dark">${a.type}</span><span class="font-mono text-xs text-slate-400 bg-white px-2 py-1 rounded border border-slate-200">${a.id}</span></div>
                            <div class="w-full bg-slate-200 rounded-full h-3 mb-3 overflow-hidden shadow-inner">
                                <div class="bg-gradient-to-r from-primary to-secondary h-3 rounded-full transition-all duration-1000 ease-out relative" style="width: ${(a.step / 4) * 100}%"><div class="absolute inset-0 bg-white/20 animate-pulse"></div></div>
                            </div>
                            <div class="flex justify-between items-center"><p class="text-xs text-slate-500 font-medium truncate max-w-[60%]">${a.purpose}</p><p class="text-xs font-bold ${a.step===4?'text-emerald-500':'text-primary'} bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">${ADM_STEPS[a.step]}</p></div>
                        </div>`).join('') || '<div class="text-center p-8 text-slate-400 font-medium">Belum ada dokumen diajukan.</div>'}
                </div></div>`;
            } else {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-5 flex items-center gap-2"><i class="ph ph-file-text text-primary text-2xl"></i> Workflow FSM Persuratan</h3>
                    ${generateTable(['ID Surat', 'Jenis & Keperluan', 'Tahap FSM Saat Ini', 'Aksi Lanjut'], db.adm.map(a => { const btn = a.step < 4 ? `<button onclick="advanceAdm('${a.id}')" class="px-4 py-2 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs font-bold shadow transition-all flex items-center gap-2 w-max"><i class="ph ph-arrow-right"></i> Naik ke: ${ADM_STEPS[a.step+1]}</button>` : '<span class="text-emerald-500 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 inline-flex items-center gap-1"><i class="ph ph-check-circle text-lg"></i> Tuntas</span>'; return [a.id, `<b>${a.type}</b><br><span class="text-xs text-slate-500">${a.purpose}</span>`, `<span class="px-3 py-1.5 bg-slate-100 rounded-lg border border-slate-200 text-xs font-bold text-slate-600">${ADM_STEPS[a.step]}</span>`, btn]; }))}
                </div>`;
            } container.innerHTML = html;
        }
        function submitAdm(e) { e.preventDefault(); const db = getDB(); db.adm.push({ id: generateId('ADM'), userId: currentUser.id, type: document.getElementById('adm-type').value, purpose: document.getElementById('adm-purp').value, step: 1 }); saveDB(db); showToast('Surat diajukan.'); renderAdm(document.getElementById('main-content')); }
        function advanceAdm(id) { const db = getDB(); const a = db.adm.find(x => x.id === id); if(a && a.step < 4) { a.step += 1; saveDB(db); showToast(`Tahap naik ke: ${ADM_STEPS[a.step]}`); renderAdm(document.getElementById('main-content')); } }

        // Helper Table Generator
        function generateTable(headers, rows) {
            return `<div class="overflow-x-auto custom-scrollbar pb-2"><table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 tracking-wider"><tr>${headers.map((h,i) => `<th class="p-4 font-bold ${i===0?'rounded-tl-xl':''} ${i===headers.length-1?'rounded-tr-xl':''}">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100">${rows.length === 0 ? `<tr><td colspan="${headers.length}" class="p-8 text-center text-slate-400 font-medium">Data kosong.</td></tr>` : rows.map(r => `<tr class="hover:bg-slate-50 transition-colors">${r.map(c => `<td class="p-4 text-slate-700">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        }

        // INIT APP
        window.onload = () => { if(!localStorage.getItem(DB_KEY)) saveDB(initialDB); checkAuth(); };
    </script>
</body>
</html>
